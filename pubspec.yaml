name: demo_ft_bloc
description: Flutter BLoC Pattern Demo App - sử dụng monorepo packages
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.6 <3.0.0"

# App shell - chỉ chứa UI (screens, examples, main)
# Toàn bộ business logic được tách ra các local packages trong thư mục packages/
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # ─── Flutter BLoC packages ───────────────────────────────
  flutter_bloc: ^8.1.1
  equatable: ^2.0.5
  bloc_concurrency: ^0.2.2

  # ─── Local packages (tách từ lib/ cũ) ───────────────────────
  todo_core:
    path: packages/todo_core
  todo_events_states:
    path: packages/todo_events_states
  todo_blocs:
    path: packages/todo_blocs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  melos: ^5.0.0

flutter:
  uses-material-design: true